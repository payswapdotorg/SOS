[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sos"
version = "0.1.0"
description = "Software Operating System W1 domain model"
requires-python = ">=3.10"

[project.optional-dependencies]
# PUB-01: the public-deployment API adapter dependency group. The default
# test suite (python3 -m pytest) stays hermetic and dependency-free: the
# frozen CI `tests` workflow installs only pytest, and the PUB-01 API tests
# skip cleanly (pytest.importorskip) when this group is absent. Install with:
#   python3 -m pip install -e ".[api]"
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
